name: Restore index layout

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore previous layout and apply overnight patch
        run: |
          set -euo pipefail
          git checkout ee95025 -- index.html
          cat > /tmp/index.patch <<'PATCH'
          diff --git a/index.html b/index.html
          index 68329f7..5f6858f 100644
          --- a/index.html
          +++ b/index.html
          @@ -50 +50,2 @@
          -    input {
          +    input,
          +    select {
          @@ -166 +167 @@
          -      grid-template-columns: minmax(150px, 180px) minmax(82px, 96px) minmax(82px, 96px) minmax(96px, 116px) minmax(190px, 1fr) auto;
          +      grid-template-columns: minmax(150px, 180px) minmax(82px, 96px) minmax(82px, 96px) minmax(96px, 116px) minmax(116px, 132px) minmax(190px, 1fr) auto;
          @@ -182 +183,2 @@
          -    input {
          +    input,
          +    select {
          @@ -274 +276 @@
          -      grid-template-columns: minmax(170px, 1fr) minmax(100px, .45fr) minmax(88px, .4fr) minmax(110px, .45fr) minmax(220px, 1fr) auto;
          +      grid-template-columns: minmax(160px, 1fr) minmax(94px, .42fr) minmax(78px, .35fr) minmax(96px, .42fr) minmax(102px, .42fr) minmax(220px, 1fr) auto;
          @@ -354 +356 @@
          -      grid-template-columns: minmax(135px, .8fr) minmax(170px, 1.1fr) minmax(88px, .45fr) minmax(88px, .45fr) minmax(102px, .55fr) minmax(102px, .55fr);
          +      grid-template-columns: minmax(130px, .75fr) minmax(160px, 1fr) minmax(82px, .42fr) minmax(82px, .42fr) minmax(96px, .5fr) minmax(96px, .5fr) minmax(108px, .55fr);
          @@ -918,0 +921,7 @@
          +          <label>
          +            Ночевка
          +            <select id="workOvernight">
          +              <option value="0" selected>0 €</option>
          +              <option value="100">100 €</option>
          +            </select>
          +          </label>
          @@ -960,0 +970,4 @@
          +            <div class="summary-cell">
          +              <span>Ночевки</span>
          +              <strong id="sumOvernight">0 €</strong>
          +            </div>
          @@ -966 +979 @@
          -          <div class="calc-line" id="sumFormula">0 ч × 13,00 € + 0 поездок × 4,86 € + паркинг 0 € = <strong>0 €</strong></div>
          +          <div class="calc-line" id="sumFormula">0 ч × 13,00 € + 0 поездок × 4,86 € + паркинг 0 € + ночевки 0 € = <strong>0 €</strong></div>
          @@ -1122,0 +1136 @@
          +      workOvernight: document.querySelector("#workOvernight"),
          @@ -1139,0 +1154 @@
          +      sumOvernight: document.querySelector("#sumOvernight"),
          @@ -1183,0 +1199 @@
          +      const overnight = readOvernight(els.workOvernight.value);
          @@ -1193 +1209,2 @@
          -        parking
          +        parking,
          +        overnight
          @@ -1199,0 +1217 @@
          +      els.workOvernight.value = 0;
          @@ -1397 +1415 @@
          -        days: Array.isArray(value?.days) ? value.days.map((day) => ({ ...day, parking: readNumber(day.parking) })) : []
          +        days: Array.isArray(value?.days) ? value.days.map((day) => ({ ...day, parking: readNumber(day.parking), overnight: readOvernight(day.overnight) })) : []
          @@ -1425,0 +1444 @@
          +      els.sumOvernight.textContent = money(totals.overnight);
          @@ -1427 +1446 @@
          -      els.sumFormula.innerHTML = `${formatDecimalHours(totals.ms)} ч × ${money(state.hourRate)} + ${totals.trips} поездок × ${money(state.tripRate)} + паркинг ${money(totals.parking)} = <strong>${money(totals.pay)}</strong>`;
          +      els.sumFormula.innerHTML = `${formatDecimalHours(totals.ms)} ч × ${money(state.hourRate)} + ${totals.trips} поездок × ${money(state.tripRate)} + паркинг ${money(totals.parking)} + ночевки ${money(totals.overnight)} = <strong>${money(totals.pay)}</strong>`;
          @@ -1469,0 +1489,4 @@
          +        <div class="metric">
          +          <span>Ночевка</span>
          +          <strong class="time-value">${money(day.overnight || 0)}</strong>
          +        </div>
          @@ -1473 +1496 @@
          -          <span>${formatDecimalHours(currentElapsed(day))} ч × ${money(state.hourRate)} + ${day.trips} × ${money(state.tripRate)} + ${money(day.parking || 0)}</span>
          +          <span>${formatDecimalHours(currentElapsed(day))} ч × ${money(state.hourRate)} + ${day.trips} × ${money(state.tripRate)} + ${money(day.parking || 0)} + ${money(day.overnight || 0)}</span>
          @@ -1517,0 +1541,7 @@
          +          <label>
          +            Ночевка
          +            <select data-edit="overnight">
          +              <option value="0"${readOvernight(day.overnight) === 0 ? " selected" : ""}>0 €</option>
          +              <option value="100"${readOvernight(day.overnight) === 100 ? " selected" : ""}>100 €</option>
          +            </select>
          +          </label>
          @@ -1542,0 +1573 @@
          +      const overnight = readOvernight(card.querySelector('[data-edit="overnight"]').value);
          @@ -1548,0 +1580 @@
          +      day.overnight = overnight;
          @@ -1562,0 +1595 @@
          +        acc.overnight += day.overnight || 0;
          @@ -1565 +1598 @@
          -      }, { ms: 0, trips: 0, parking: 0, pay: 0 });
          +      }, { ms: 0, trips: 0, parking: 0, overnight: 0, pay: 0 });
          @@ -1573 +1606 @@
          -      return (currentElapsed(day) / 3600000 * state.hourRate) + (day.trips * state.tripRate) + (day.parking || 0);
          +      return (currentElapsed(day) / 3600000 * state.hourRate) + (day.trips * state.tripRate) + (day.parking || 0) + (day.overnight || 0);
          @@ -1698,0 +1732,4 @@
          +    function readOvernight(value) {
          +      return Number(value) === 100 ? 100 : 0;
          +    }
          +
          @@ -1710 +1747 @@
          -      const header = ["Дата", "Заметка", "Время", "Поездки", "Паркинг", "Сумма"];
          +      const header = ["Дата", "Заметка", "Время", "Поездки", "Паркинг", "Ночевка", "Сумма"];
          @@ -1716,0 +1754 @@
          +        (day.overnight || 0).toFixed(2),
          PATCH
          sed -i 's/^          //' /tmp/index.patch
          git apply --unidiff-zero /tmp/index.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No index changes needed"
          else
            git commit -m "Restore original interface with overnight option"
            git push
          fi
