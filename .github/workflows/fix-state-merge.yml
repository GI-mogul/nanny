name: Fix shared state merge

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-state-merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch state synchronization
        run: |
          node <<'NODE'
          const fs = require('fs');

          let index = fs.readFileSync('index.html', 'utf8');
          index = index.replace(
            '      tripRate: 4.86,\n      days: []',
            '      tripRate: 4.86,\n      ratesUpdatedAt: null,\n      deletedDays: {},\n      days: []'
          );
          index = index.replace(
            '        parking,\n        overnight\n      });',
            '        parking,\n        overnight,\n        updatedAt: nowIso()\n      });'
          );
          index = index.replace(
            '      state.tripRate = readNumber(els.tripRate.value);\n      setRatesEditing(false);',
            '      state.tripRate = readNumber(els.tripRate.value);\n      state.ratesUpdatedAt = nowIso();\n      setRatesEditing(false);'
          );
          index = index.replace(
            '      if (action === "remove" && confirm("Удалить этот день?")) {\n        state.days = state.days.filter((item) => item.id !== day.id);',
            '      if (action === "remove" && confirm("Удалить этот день?")) {\n        state.deletedDays = { ...(state.deletedDays || {}), [day.id]: nowIso() };\n        state.days = state.days.filter((item) => item.id !== day.id);'
          );
          index = index.replace(
            '        if (serverState?.days?.length || serverState?.hourRate || serverState?.tripRate) {\n          state = normalizeClientState(serverState);\n          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));\n        } else if (state.days.length) {',
            '        if (serverState?.days?.length || serverState?.hourRate || serverState?.tripRate) {\n          const normalizedServerState = normalizeClientState(serverState);\n          state = mergeClientStates(normalizedServerState, state);\n          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));\n          if (JSON.stringify(state) !== JSON.stringify(normalizedServerState)) {\n            await saveServerStateNow();\n          }\n        } else if (state.days.length) {'
          );
          index = index.replace(
            /    function normalizeClientState\(value\) \{\n      return \{\n        \.\.\.defaultState,\n        \.\.\.value,\n        days: Array\.isArray\(value\?\.days\) \? value\.days\.map\(\(day\) => \(\{ \.\.\.day, parking: readNumber\(day\.parking\), overnight: readOvernight\(day\.overnight\) \}\)\) : \[\]\n      \};\n    \}\n/,
            `    function normalizeClientState(value) {\n      const deletedDays = value?.deletedDays && typeof value.deletedDays === "object" ? value.deletedDays : {};\n      return {\n        ...defaultState,\n        ...value,\n        deletedDays,\n        days: Array.isArray(value?.days) ? value.days.map((day) => ({\n          ...day,\n          parking: readNumber(day.parking),\n          overnight: readOvernight(day.overnight),\n          updatedAt: day.updatedAt || null\n        })) : []\n      };\n    }\n\n    function mergeClientStates(serverValue, localValue) {\n      const serverState = normalizeClientState(serverValue);\n      const localState = normalizeClientState(localValue);\n      const merged = {\n        ...serverState,\n        deletedDays: { ...serverState.deletedDays }\n      };\n\n      if (localState.ratesUpdatedAt && timestampMs(localState.ratesUpdatedAt) >= timestampMs(serverState.ratesUpdatedAt)) {\n        merged.hourRate = localState.hourRate;\n        merged.tripRate = localState.tripRate;\n        merged.ratesUpdatedAt = localState.ratesUpdatedAt;\n      }\n\n      for (const [id, deletedAt] of Object.entries(localState.deletedDays || {})) {\n        if (timestampMs(deletedAt) >= timestampMs(merged.deletedDays[id])) {\n          merged.deletedDays[id] = deletedAt;\n        }\n      }\n\n      const daysById = new Map(serverState.days.map((day) => [day.id, day]));\n      for (const day of localState.days) {\n        const current = daysById.get(day.id);\n        if (!current || timestampMs(day.updatedAt) >= timestampMs(current.updatedAt)) {\n          daysById.set(day.id, day);\n        }\n      }\n\n      for (const [id, deletedAt] of Object.entries(merged.deletedDays)) {\n        const day = daysById.get(id);\n        if (day && timestampMs(deletedAt) >= timestampMs(day.updatedAt)) {\n          daysById.delete(id);\n        }\n      }\n\n      merged.days = [...daysById.values()].sort((a, b) => b.date.localeCompare(a.date));\n      return merged;\n    }\n`
          );
          index = index.replace(
            '      day.overnight = overnight;\n      editingDayId = null;',
            '      day.overnight = overnight;\n      day.updatedAt = nowIso();\n      editingDayId = null;'
          );
          index = index.replace(
            '    function currentElapsed(day) {',
            '    function nowIso() {\n      return new Date().toISOString();\n    }\n\n    function timestampMs(value) {\n      if (!value) return 0;\n      const ms = Date.parse(value);\n      return Number.isFinite(ms) ? ms : 0;\n    }\n\n    function currentElapsed(day) {'
          );
          fs.writeFileSync('index.html', index);

          let server = fs.readFileSync('server.js', 'utf8');
          server = server.replace(
            'async function saveSharedState(value) {\n  await dataStoreReady;\n  const normalized = normalizeState(value);',
            'async function saveSharedState(value) {\n  await dataStoreReady;\n  const previous = await getSharedState();\n  const normalized = mergeStates(previous, value);'
          );
          server = server.replace(
            '    tripRate: readPositiveNumber(state.tripRate, 4.86),\n    days: Array.isArray(state.days) ? state.days.map(normalizeDay).filter(Boolean) : []\n  };\n}\n\nfunction normalizeDay(day) {',
            `    tripRate: readPositiveNumber(state.tripRate, 4.86),\n    ratesUpdatedAt: normalizeTimestamp(state.ratesUpdatedAt),\n    deletedDays: normalizeDeletedDays(state.deletedDays),\n    days: Array.isArray(state.days) ? state.days.map(normalizeDay).filter(Boolean) : []\n  };\n}\n\nfunction mergeStates(previousValue, nextValue) {\n  const hasPrevious = previousValue && typeof previousValue === "object";\n  const previous = normalizeState(previousValue);\n  const next = normalizeState(nextValue);\n  const merged = {\n    ...previous,\n    ratesVersion: next.ratesVersion || previous.ratesVersion,\n    deletedDays: { ...previous.deletedDays }\n  };\n\n  if (!hasPrevious || (next.ratesUpdatedAt && timestampMs(next.ratesUpdatedAt) >= timestampMs(previous.ratesUpdatedAt))) {\n    merged.hourRate = next.hourRate;\n    merged.tripRate = next.tripRate;\n    merged.ratesUpdatedAt = next.ratesUpdatedAt;\n  }\n\n  for (const [id, deletedAt] of Object.entries(next.deletedDays)) {\n    if (timestampMs(deletedAt) >= timestampMs(merged.deletedDays[id])) {\n      merged.deletedDays[id] = deletedAt;\n    }\n  }\n\n  const daysById = new Map(previous.days.map((day) => [day.id, day]));\n  for (const day of next.days) {\n    const current = daysById.get(day.id);\n    if (!current || timestampMs(day.updatedAt) >= timestampMs(current.updatedAt)) {\n      daysById.set(day.id, day);\n    }\n  }\n\n  for (const [id, deletedAt] of Object.entries(merged.deletedDays)) {\n    const day = daysById.get(id);\n    if (day && timestampMs(deletedAt) >= timestampMs(day.updatedAt)) {\n      daysById.delete(id);\n    }\n  }\n\n  merged.days = [...daysById.values()].sort((a, b) => b.date.localeCompare(a.date));\n  return merged;\n}\n\nfunction normalizeDay(day) {`
          );
          server = server.replace(
            '    parking: readPositiveNumber(day.parking, 0),\n    overnight: readOvernight(day.overnight)\n  };\n}\n\nfunction readPositiveNumber(value, fallback) {',
            `    parking: readPositiveNumber(day.parking, 0),\n    overnight: readOvernight(day.overnight),\n    updatedAt: normalizeTimestamp(day.updatedAt)\n  };\n}\n\nfunction normalizeDeletedDays(value) {\n  if (!value || typeof value !== "object" || Array.isArray(value)) return {};\n  return Object.fromEntries(\n    Object.entries(value)\n      .map(([id, deletedAt]) => [String(id), normalizeTimestamp(deletedAt)])\n      .filter(([, deletedAt]) => deletedAt)\n  );\n}\n\nfunction normalizeTimestamp(value) {\n  const timestamp = typeof value === "string" ? value : null;\n  if (!timestamp) return null;\n  const ms = Date.parse(timestamp);\n  return Number.isFinite(ms) ? new Date(ms).toISOString() : null;\n}\n\nfunction timestampMs(value) {\n  if (!value) return 0;\n  const ms = Date.parse(value);\n  return Number.isFinite(ms) ? ms : 0;\n}\n\nfunction readPositiveNumber(value, fallback) {`
          );
          fs.writeFileSync('server.js', server);
          NODE
          node --check server.js
          node scripts/verify-release.js
      - name: Commit fix and remove workflow
        run: |
          rm .github/workflows/fix-state-merge.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html server.js .github/workflows/fix-state-merge.yml
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Fix shared state merge for multiple users"
            git push
          fi
