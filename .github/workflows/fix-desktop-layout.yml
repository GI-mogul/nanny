name: Fix desktop layout

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-desktop-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch desktop layout
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'index.html';
          let text = fs.readFileSync(path, 'utf8');
          text = text.replace(
            /grid-template-columns: minmax\(760px, 1fr\) minmax\(360px, 400px\);/,
            'grid-template-columns: minmax(0, 1fr) minmax(320px, 360px);'
          );
          text = text.replace(
            /grid-template-columns: minmax\(150px, 180px\) minmax\(82px, 96px\) minmax\(82px, 96px\) minmax\(96px, 116px\) minmax\(116px, 132px\) minmax\(190px, 1fr\) auto;\n      gap: 10px;\n      align-items: end;\n      padding: 16px;/,
            'grid-template-columns: minmax(128px, 1fr) minmax(70px, .5fr) minmax(70px, .5fr) minmax(86px, .65fr) minmax(96px, .7fr) minmax(140px, 1fr) auto;\n      gap: 8px;\n      align-items: end;\n      padding: 14px;'
          );
          text = text.replace(
            /grid-template-columns: minmax\(160px, 1fr\) minmax\(94px, \.42fr\) minmax\(78px, \.35fr\) minmax\(96px, \.42fr\) minmax\(102px, \.42fr\) minmax\(220px, 1fr\) auto;\n      gap: 14px;/,
            'grid-template-columns: minmax(140px, 1.2fr) minmax(74px, .5fr) minmax(66px, .4fr) minmax(78px, .5fr) minmax(78px, .5fr) minmax(138px, 1fr) auto;\n      gap: 8px;'
          );
          text = text.replace(
            /    \.day-date strong \{\n      display: block;\n      font-size: 1rem;\n    \}\n/,
            '    .day-date strong {\n      display: block;\n      font-size: 1rem;\n    }\n\n    .day-date,\n    .metric {\n      min-width: 0;\n    }\n'
          );
          text = text.replace(
            /    \.day-date span,\n    \.metric span \{\n      color: var\(--muted\);\n      font-size: \.81rem;\n    \}/,
            '    .day-date span,\n    .metric span {\n      color: var(--muted);\n      font-size: .81rem;\n      line-height: 1.3;\n    }'
          );
          text = text.replace(
            /font-size: 1\.2rem;/,
            'font-size: 1.08rem;'
          );
          text = text.replace(
            /@media \(max-width: 920px\)/,
            '@media (max-width: 1120px)'
          );
          fs.writeFileSync(path, text);
          NODE
          node --check server.js
          node scripts/verify-release.js
      - name: Commit fix and remove workflow
        run: |
          rm .github/workflows/fix-desktop-layout.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/fix-desktop-layout.yml
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Fix desktop layout for overnight field"
            git push
          fi
