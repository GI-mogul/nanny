name: Fix auth state validation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-auth-state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch server auth state
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'server.js';
          let text = fs.readFileSync(path, 'utf8');
          text = text.replace('const oauthStates = new Map();\n', '');
          text = text.replace('  oauthStates.set(state, Date.now() + 10 * 60 * 1000);\n\n', '');
          text = text.replace('  const stateExpiresAt = oauthStates.get(state);\n\n  if (!code || !state || state !== cookieState || !stateExpiresAt || stateExpiresAt < Date.now()) {', '  if (!code || !state || state !== cookieState) {');
          text = text.replace('  oauthStates.delete(state);\n\n  try {', '  try {');
          fs.writeFileSync(path, text);
          NODE
          node --check server.js
      - name: Commit fix and remove workflow
        run: |
          rm .github/workflows/fix-auth-state.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js .github/workflows/fix-auth-state.yml
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Fix Google auth state validation"
            git push
          fi
